name: Python Test CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行自动化单元测试
        run: |
          python -c "import calculator; assert calculator.add(2, 3) == 5, '加法异常'"
          python -c "import calculator; assert calculator.multiply(4, 5) == 20, '乘法异常'"
          python -c "import calculator; assert calculator.power(2, 3) == 8, '乘方异常'"
          python -c "import calculator; assert calculator.divide(10, 2) == 5, '除法异常'"
          python -c "import calculator; assert calculator.modulo(10, 3) == 1, '取模异常'"
          echo "🎉 所有数学运算自动化测试全部通过！"
